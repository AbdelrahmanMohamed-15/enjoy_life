name: easy_life
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  #Package for base app and structure
  flutter_phoenix: ^1.1.1
  get_it: ^8.0.3
  flutter_easyloading: ^3.0.5
  app_links: ^6.4.0
  share_plus: ^11.0.0
  flutter_portal: ^1.1.4
  #Package for State Management
  flutter_bloc: ^9.1.1
  #Package for responsive app and fonts
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^10.8.0
  carousel_slider: ^5.1.1
  flutter_svg: ^2.2.0
  country_code_picker: ^3.3.0
  pinput: ^5.0.1
  flutter_html: ^3.0.0
  #Package for Languague and localiztion
  easy_localization: ^3.0.7+1
  #Package for Rest pi
  dio: ^5.8.0+1
  dartz: ^0.10.1
  equatable: ^2.0.7
  logger: ^2.5.0
  google_maps_flutter: ^2.12.3
  like_button: ^2.1.0
  #Package for Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  image_picker: ^1.2.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/translations/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
    - family: Cairo-Bold
      fonts:
        - asset: assets/fonts/Cairo-Bold.ttf
